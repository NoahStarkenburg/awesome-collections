# Root pyproject for shared dev tooling — each project under this repo has its
# own pyproject for build metadata. Ruff config here covers the whole tree.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".local",
    ".venv",
    "build",
    "dist",
    "**/__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line-too-long — keep, but enforced via formatter rather than linter
    "B008",   # function-call-in-default — fine for argparse / dataclass field()
    "SIM108", # ternary suggestion — clarity over cleverness
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"**/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
