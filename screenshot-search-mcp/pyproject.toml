[project]
name = "screenshot-search-mcp"
version = "0.1.0"
description = "MCP server that indexes screenshots by OCR text and CLIP visual embedding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Noah Starkenburg" }]
keywords = ["mcp", "fastmcp", "ocr", "clip", "screenshots", "search"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastmcp>=2.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "watchdog>=4.0",
]

[project.optional-dependencies]
# Visual search (search_visual, find_similar). Pulls in PyTorch — ~1 GB of
# wheels. Skip this extra if you only need OCR-based text search.
visual = [
    "open-clip-torch>=2.24",
    "numpy>=1.26",
]
# PDF page indexing — rasterizes each page so the OCR pipeline picks it up.
pdf = [
    "pypdfium2>=4.30",
]
# Optional FAISS index for fast nearest-neighbor over large embedding stores.
# Falls back to in-Python cosine when missing.
faiss = [
    "faiss-cpu>=1.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pypdfium2>=4.30",
    # piexif is only used by tests to write EXIF metadata into fixture JPEGs;
    # the production code reads EXIF via Pillow alone.
    "piexif>=1.1",
]
# Convenience: `pip install -e .[all]` for the full feature set.
all = [
    "open-clip-torch>=2.24",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    "faiss-cpu>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
screenshot-search-mcp = "screenshot_search.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screenshot_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
