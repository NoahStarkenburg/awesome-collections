[project]
name = "screenshot-search-mcp"
version = "0.1.0"
description = "MCP server that indexes screenshots by OCR text and CLIP visual embedding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Noah Starkenburg" }]
keywords = ["mcp", "fastmcp", "ocr", "clip", "screenshots", "search"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastmcp>=2.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "open-clip-torch>=2.24",
    "numpy>=1.26",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
screenshot-search-mcp = "screenshot_search.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screenshot_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
